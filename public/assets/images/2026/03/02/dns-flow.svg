<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="JetBrains Mono, SF Mono, Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3a7bd5"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ffb74d"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#00e676"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f857a6"/>
    </marker>
  </defs>

  <rect width="900" height="340" rx="12" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="30" x2="900" y2="30"/><line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="90" x2="900" y2="90"/><line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="0" y1="210" x2="900" y2="210"/><line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="270" x2="900" y2="270"/><line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="30" y1="0" x2="30" y2="340"/><line x1="60" y1="0" x2="60" y2="340"/>
    <line x1="90" y1="0" x2="90" y2="340"/><line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="150" y1="0" x2="150" y2="340"/><line x1="180" y1="0" x2="180" y2="340"/>
    <line x1="210" y1="0" x2="210" y2="340"/><line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="270" y1="0" x2="270" y2="340"/><line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="330" y1="0" x2="330" y2="340"/><line x1="360" y1="0" x2="360" y2="340"/>
    <line x1="390" y1="0" x2="390" y2="340"/><line x1="420" y1="0" x2="420" y2="340"/>
    <line x1="450" y1="0" x2="450" y2="340"/><line x1="480" y1="0" x2="480" y2="340"/>
    <line x1="510" y1="0" x2="510" y2="340"/><line x1="540" y1="0" x2="540" y2="340"/>
    <line x1="570" y1="0" x2="570" y2="340"/><line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="630" y1="0" x2="630" y2="340"/><line x1="660" y1="0" x2="660" y2="340"/>
    <line x1="690" y1="0" x2="690" y2="340"/><line x1="720" y1="0" x2="720" y2="340"/>
    <line x1="750" y1="0" x2="750" y2="340"/><line x1="780" y1="0" x2="780" y2="340"/>
    <line x1="810" y1="0" x2="810" y2="340"/><line x1="840" y1="0" x2="840" y2="340"/>
    <line x1="870" y1="0" x2="870" y2="340"/>
  </g>

  <!-- Step labels -->
  <g font-size="10" fill="#6a6a9a" font-weight="700" letter-spacing="0.5">
    <text x="198" y="28" text-anchor="middle">① DNS query</text>
    <text x="198" y="128" text-anchor="middle">② DNS response</text>
    <text x="290" y="185" text-anchor="middle">③ HTTPS request</text>
    <text x="610" y="140" text-anchor="middle">④ DNS lookup</text>
    <text x="663" y="28" text-anchor="middle">⑤ HTTP proxy</text>
  </g>

  <!-- === Nodes === -->

  <!-- PC -->
  <rect x="30" y="48" width="120" height="60" rx="8" fill="#1e1e3a" stroke="#3a7bd5" stroke-width="1" filter="url(#shadow)"/>
  <text x="90" y="73" font-size="13" font-weight="700" fill="#e0e0ff" text-anchor="middle">PC</text>
  <text x="90" y="93" font-size="9" fill="#6a6a9a" text-anchor="middle">Browser</text>

  <!-- OpenWRT -->
  <rect x="250" y="48" width="140" height="60" rx="8" fill="#1e1e3a" stroke="#ffb74d" stroke-width="1" filter="url(#shadow)"/>
  <text x="320" y="73" font-size="12" font-weight="700" fill="#ffb74d" text-anchor="middle">OpenWRT</text>
  <text x="320" y="93" font-size="9" fill="#6a6a9a" text-anchor="middle">192.168.1.1</text>

  <!-- Caddy -->
  <rect x="460" y="48" width="150" height="60" rx="8" fill="#0a2e14" stroke="#00e676" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="475" cy="66" r="4" fill="#00e676"/>
  <text x="535" y="73" font-size="13" font-weight="700" fill="#00e676" text-anchor="middle">Caddy</text>
  <text x="535" y="93" font-size="9" fill="#4caf50" text-anchor="middle">192.168.10.2</text>

  <!-- PowerDNS (directly below Caddy) -->
  <rect x="460" y="220" width="150" height="55" rx="8" fill="#1e1e3a" stroke="#f857a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="535" y="245" font-size="12" font-weight="700" fill="#f8bbd0" text-anchor="middle">PowerDNS</text>
  <text x="535" y="263" font-size="9" fill="#6a6a9a" text-anchor="middle">10.0.100.2</text>

  <!-- Service (target) -->
  <rect x="720" y="48" width="150" height="60" rx="8" fill="#1e1e3a" stroke="#f857a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="795" y="73" font-size="11" font-weight="700" fill="#f8bbd0" text-anchor="middle">paperless-ngx</text>
  <text x="795" y="93" font-size="9" fill="#6a6a9a" text-anchor="middle">10.0.100.12</text>

  <!-- === Arrows === -->

  <!-- ❶ PC → OpenWRT (DNS query) -->
  <line x1="150" y1="65" x2="246" y2="65" stroke="#ffb74d" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow-orange)"/>
  <text x="198" y="58" font-size="8" fill="#ffb74d" text-anchor="middle" opacity="0.8">*.int.mzyy94.com?</text>

  <!-- ❷ OpenWRT → PC (DNS response) -->
  <line x1="246" y1="92" x2="154" y2="92" stroke="#ffb74d" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow-orange)"/>
  <text x="198" y="105" font-size="8" fill="#ffb74d" text-anchor="middle" opacity="0.8">→ 192.168.10.2</text>

  <!-- ❸ PC → Caddy (HTTPS) — L-route entering Caddy from bottom -->
  <path d="M 90 108 Q 90 200 140 200 L 440 200 Q 490 200 490 108" fill="none" stroke="#3a7bd5" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow-blue)"/>
  <rect x="190" y="210" width="200" height="18" rx="4" fill="#1a1a3e" stroke="#3a7bd5" stroke-width="0.5" opacity="0.8"/>
  <text x="290" y="223" font-size="8" fill="#5a8ec0" text-anchor="middle">https://paperless-ngx.int.…</text>

  <!-- ❹ Caddy → PowerDNS (DNS lookup, downward) -->
  <line x1="520" y1="108" x2="520" y2="216" stroke="#f857a6" stroke-width="1.2" opacity="0.5" stroke-dasharray="5 3" marker-end="url(#arrow-pink)"/>

  <!-- ❹ PowerDNS → Caddy (DNS response, upward) -->
  <line x1="550" y1="220" x2="550" y2="112" stroke="#f857a6" stroke-width="1.2" opacity="0.5" stroke-dasharray="5 3" marker-end="url(#arrow-pink)"/>
  <text x="610" y="168" font-size="8" fill="#f8bbd0" text-anchor="middle" opacity="0.8">10.0.100.12</text>

  <!-- ❺ Caddy → Service (HTTP proxy) -->
  <line x1="610" y1="78" x2="716" y2="78" stroke="#00e676" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow-green)"/>
  <text x="663" y="70" font-size="8" fill="#4caf50" text-anchor="middle" opacity="0.8">HTTP :80</text>

  <!-- Annotation: OpenWRT DNS config -->
  <rect x="230" y="132" width="182" height="18" rx="4" fill="#ffb74d" opacity="0.1"/>
  <text x="321" y="145" font-size="8" fill="#ffb74d" text-anchor="middle" opacity="0.7">*.int.mzyy94.com → Caddy</text>

  <!-- Annotation: SDN zone -->
  <rect x="720" y="120" width="150" height="16" rx="4" fill="#f857a6" opacity="0.08"/>
  <text x="795" y="132" font-size="8" fill="#c0607a" text-anchor="middle" opacity="0.7">10.0.100.0/24</text>

  <!-- Legend -->
  <g transform="translate(30, 280)">
    <rect width="250" height="42" rx="6" fill="#1e1e3a" stroke="#fff" stroke-width="0.3" opacity="0.6"/>
    <line x1="15" y1="22" x2="40" y2="22" stroke="#ffb74d" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
    <text x="50" y="26" font-size="9" fill="#8899bb">DNS</text>
    <line x1="90" y1="22" x2="115" y2="22" stroke="#3a7bd5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="125" y="26" font-size="9" fill="#8899bb">HTTPS</text>
    <line x1="170" y1="22" x2="195" y2="22" stroke="#00e676" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="205" y="26" font-size="9" fill="#8899bb">Proxy</text>
  </g>
</svg>
