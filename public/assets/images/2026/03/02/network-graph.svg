<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="JetBrains Mono, SF Mono, Menlo, monospace">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="lan-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3a7bd5" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="sdn-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f857a6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff5858" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="pve-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="900" height="560" rx="12" fill="url(#bg2)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="30" y1="0" x2="30" y2="560"/><line x1="60" y1="0" x2="60" y2="560"/>
    <line x1="90" y1="0" x2="90" y2="560"/><line x1="120" y1="0" x2="120" y2="560"/>
    <line x1="150" y1="0" x2="150" y2="560"/><line x1="180" y1="0" x2="180" y2="560"/>
    <line x1="210" y1="0" x2="210" y2="560"/><line x1="240" y1="0" x2="240" y2="560"/>
    <line x1="270" y1="0" x2="270" y2="560"/><line x1="300" y1="0" x2="300" y2="560"/>
    <line x1="330" y1="0" x2="330" y2="560"/><line x1="360" y1="0" x2="360" y2="560"/>
    <line x1="390" y1="0" x2="390" y2="560"/><line x1="420" y1="0" x2="420" y2="560"/>
    <line x1="450" y1="0" x2="450" y2="560"/><line x1="480" y1="0" x2="480" y2="560"/>
    <line x1="510" y1="0" x2="510" y2="560"/><line x1="540" y1="0" x2="540" y2="560"/>
    <line x1="570" y1="0" x2="570" y2="560"/><line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="630" y1="0" x2="630" y2="560"/><line x1="660" y1="0" x2="660" y2="560"/>
    <line x1="690" y1="0" x2="690" y2="560"/><line x1="720" y1="0" x2="720" y2="560"/>
    <line x1="750" y1="0" x2="750" y2="560"/><line x1="780" y1="0" x2="780" y2="560"/>
    <line x1="810" y1="0" x2="810" y2="560"/><line x1="840" y1="0" x2="840" y2="560"/>
    <line x1="870" y1="0" x2="870" y2="560"/>
    <line x1="0" y1="30" x2="900" y2="30"/><line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="90" x2="900" y2="90"/><line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="0" y1="210" x2="900" y2="210"/><line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="270" x2="900" y2="270"/><line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="330" x2="900" y2="330"/><line x1="0" y1="360" x2="900" y2="360"/>
    <line x1="0" y1="390" x2="900" y2="390"/><line x1="0" y1="420" x2="900" y2="420"/>
    <line x1="0" y1="450" x2="900" y2="450"/><line x1="0" y1="480" x2="900" y2="480"/>
    <line x1="0" y1="510" x2="900" y2="510"/><line x1="0" y1="540" x2="900" y2="540"/>
  </g>

  <!-- Proxmox boundary (outermost, wrapping LAN and SDN) -->
  <rect x="30" y="30" width="670" height="500" rx="10" fill="url(#pve-grad)" stroke="#ff9800" stroke-width="1.2" stroke-dasharray="8 4" opacity="0.8"/>
  <rect x="30" y="30" width="120" height="22" rx="4" fill="#ff9800" opacity="0.9"/>
  <text x="42" y="45" font-size="10" font-weight="700" fill="#1a1a2e" letter-spacing="1">PROXMOX VE</text>

  <!-- LAN Zone (inside Proxmox + extends right for PC) -->
  <rect x="45" y="65" width="825" height="210" rx="8" fill="url(#lan-grad)" stroke="#3a7bd5" stroke-width="1" opacity="0.9"/>
  <text x="67" y="88" font-size="11" font-weight="700" fill="#00d2ff" letter-spacing="2">LAN</text>
  <text x="103" y="88" font-size="10" fill="#5a8ec0">192.168.0.0/16</text>

  <!-- SDN Zone (inside Proxmox) -->
  <rect x="45" y="320" width="640" height="195" rx="8" fill="url(#sdn-grad)" stroke="#f857a6" stroke-width="1" opacity="0.9"/>
  <text x="67" y="345" font-size="11" font-weight="700" fill="#f857a6" letter-spacing="2">SDN</text>
  <text x="103" y="345" font-size="10" fill="#c0607a">10.0.100.0/24</text>

  <!-- Connection lines -->
  <!-- LAN backbone - horizontal -->
  <line x1="310" y1="178" x2="730" y2="178" stroke="#3a7bd5" stroke-width="2" opacity="0.4"/>

  <!-- Rockstor to backbone -->
  <line x1="255" y1="178" x2="310" y2="178" stroke="#3a7bd5" stroke-width="1.5" opacity="0.4"/>
  <!-- OpenWRT to backbone vertical -->
  <line x1="420" y1="148" x2="420" y2="178" stroke="#ffb74d" stroke-width="1.5" opacity="0.4"/>
  <!-- Caddy to backbone vertical -->
  <line x1="420" y1="178" x2="420" y2="198" stroke="#3a7bd5" stroke-width="1.5" opacity="0.4"/>
  <!-- PC to backbone - straight horizontal line -->
  <line x1="730" y1="178" x2="760" y2="178" stroke="#3a7bd5" stroke-width="1.5" opacity="0.4"/>

  <!-- Caddy to SDN -->
  <line x1="420" y1="253" x2="420" y2="320" stroke="#f857a6" stroke-width="1.5" opacity="0.4" stroke-dasharray="5 3"/>
  <!-- Caddy to Pocket ID -->
  <path d="M 385 253 Q 280 310 195 370" fill="none" stroke="#00e676" stroke-width="1" opacity="0.35"/>
  <!-- Caddy to PowerDNS -->
  <path d="M 440 253 Q 435 320 410 370" fill="none" stroke="#00e676" stroke-width="1" opacity="0.35"/>

  <!-- === Nodes === -->

  <!-- OpenWRT (above Caddy) -->
  <rect x="345" y="93" width="155" height="55" rx="8" fill="#1e1e3a" stroke="#ffb74d" stroke-width="1" filter="url(#card-shadow)"/>
  <text x="422" y="118" font-size="12" font-weight="700" fill="#ffb74d" text-anchor="middle">OpenWRT</text>
  <text x="422" y="136" font-size="9" fill="#6a6a9a" text-anchor="middle">Router / DHCP</text>

  <!-- Caddy (below OpenWRT) -->
  <rect x="345" y="198" width="155" height="55" rx="8" fill="#0a2e14" stroke="#00e676" stroke-width="1.5" filter="url(#card-shadow)"/>
  <circle cx="360" cy="216" r="4" fill="#00e676"/>
  <text x="422" y="223" font-size="13" font-weight="700" fill="#00e676" text-anchor="middle">Caddy</text>
  <text x="422" y="241" font-size="9" fill="#4caf50" text-anchor="middle">Reverse Proxy + SSO</text>

  <!-- Rockstor (left) -->
  <rect x="100" y="153" width="155" height="55" rx="8" fill="#1e1e3a" stroke="#3a7bd5" stroke-width="1" filter="url(#card-shadow)"/>
  <text x="177" y="178" font-size="13" font-weight="700" fill="#e0e0ff" text-anchor="middle">Rockstor</text>
  <text x="177" y="196" font-size="9" fill="#6a6a9a" text-anchor="middle">NAS / Services</text>

  <!-- Other LXC (LAN side) -->
  <line x1="615" y1="148" x2="615" y2="178" stroke="#3a7bd5" stroke-width="1.5" opacity="0.3"/>
  <rect x="550" y="93" width="130" height="55" rx="8" fill="#1e1e3a" stroke="#3a7bd5" stroke-width="0.5" opacity="0.6" filter="url(#card-shadow)"/>
  <text x="615" y="125" font-size="11" fill="#6a6a9a" text-anchor="middle">Other LXC...</text>

  <!-- PC (outside Proxmox, right) -->
  <rect x="760" y="153" width="100" height="50" rx="8" fill="#1e1e3a" stroke="#3a7bd5" stroke-width="1" filter="url(#card-shadow)"/>
  <text x="810" y="176" font-size="13" font-weight="700" fill="#e0e0ff" text-anchor="middle">PC</text>
  <text x="810" y="192" font-size="9" fill="#6a6a9a" text-anchor="middle">Client</text>

  <!-- Pocket ID -->
  <rect x="100" y="370" width="160" height="55" rx="8" fill="#1e1e3a" stroke="#f857a6" stroke-width="1" filter="url(#card-shadow)"/>
  <text x="180" y="395" font-size="12" font-weight="700" fill="#f8bbd0" text-anchor="middle">Pocket ID</text>
  <text x="180" y="413" font-size="9" fill="#6a6a9a" text-anchor="middle">OIDC Provider</text>

  <!-- PowerDNS -->
  <rect x="310" y="370" width="160" height="55" rx="8" fill="#1e1e3a" stroke="#f857a6" stroke-width="1" filter="url(#card-shadow)"/>
  <text x="390" y="395" font-size="12" font-weight="700" fill="#f8bbd0" text-anchor="middle">PowerDNS</text>
  <text x="390" y="413" font-size="9" fill="#6a6a9a" text-anchor="middle">DNS Server</text>

  <!-- Other LXC -->
  <rect x="100" y="450" width="160" height="45" rx="8" fill="#1e1e3a" stroke="#f857a6" stroke-width="0.5" opacity="0.6" filter="url(#card-shadow)"/>
  <text x="180" y="478" font-size="11" fill="#6a6a9a" text-anchor="middle">Other LXC...</text>

  <rect x="310" y="450" width="160" height="45" rx="8" fill="#1e1e3a" stroke="#f857a6" stroke-width="0.5" opacity="0.6" filter="url(#card-shadow)"/>
  <text x="390" y="478" font-size="11" fill="#6a6a9a" text-anchor="middle">Other LXC...</text>

  <!-- Legend (simplified) -->
  <rect x="720" y="320" width="150" height="100" rx="8" fill="#1e1e3a" stroke="#ffffff" stroke-width="0.5" opacity="0.8"/>
  <line x1="740" y1="345" x2="770" y2="345" stroke="#3a7bd5" stroke-width="2"/>
  <text x="780" y="349" font-size="10" fill="#8899bb">LAN</text>
  <line x1="740" y1="370" x2="770" y2="370" stroke="#f857a6" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="780" y="374" font-size="10" fill="#c0607a">SDN</text>
  <rect x="740" y="388" width="14" height="14" rx="3" fill="none" stroke="#ff9800" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="780" y="400" font-size="10" fill="#ff9800">Proxmox</text>
</svg>
